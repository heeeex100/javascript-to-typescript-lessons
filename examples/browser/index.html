<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第 07 课 · 我的学习任务</title>
  <link rel="icon" href="data:,">
  <style>
    body { max-width: 680px; margin: 60px auto; padding: 0 20px; font: 17px/1.7 system-ui, sans-serif; color: #213247; background: #f5f7fa; }
    h1 { line-height: 1.3; }
    form { display: flex; gap: 10px; flex-wrap: wrap; }
    label { width: 100%; }
    input { flex: 1; min-width: 160px; }
    input, button { font: inherit; padding: 8px 12px; border: 1px solid #abb9c9; border-radius: 8px; }
    button { background: #174a78; color: white; cursor: pointer; }
    button:disabled { background: #596776; cursor: default; }
    ul { padding: 0; list-style: none; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #d2d9e1; }
    li span { overflow-wrap: anywhere; }
    .done { text-decoration: line-through; color: #526172; }
    #message { min-height: 1.7em; color: #9a3021; }
    .hint { color: #526172; font-size: 15px; }
  </style>
  <script defer src="./app.js"></script>
</head>
<body>
  <p class="hint">JavaScript · 第 07 课</p>
  <h1>我的学习任务</h1>
  <p>输入一件想完成的小事，再观察数据怎样变成页面。</p>
  <form id="task-form">
    <label for="title">任务标题</label>
    <input id="title" placeholder="例如：练习数组的 map" autocomplete="off">
    <button type="submit">添加</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <ul id="tasks" aria-label="任务列表"></ul>
  <p class="hint">此示例仅保存在页面内存中，刷新会恢复初始任务。</p>
</body>
</html>
